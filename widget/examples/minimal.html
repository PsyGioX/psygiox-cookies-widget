<title>PGX Cookies Widget — minimal example</title>
<!-- 1. the widget: first script in <head>. CSS and language packs are found next to it. -->
<script src="../dist/psygiox-cookies.min.js" data-policy="#cookies" data-privacy="#privacy" data-theme="auto"></script>
</head>
<body>
<h1>Minimal example</h1>
<p>Open the page: a banner appears; the rules depend on your region (<code>data-region="eu"</code> forces one).</p>
<!-- 2. a permanent link to reopen the settings (required in the US profile: “Your Privacy Choices”) -->
<p><a href="#" data-pc-open>Cookie settings</a> · <a href="#" data-pc-open="live">Live cookies</a></p>
<h2 id="cookies">Cookie policy</h2><p>Describe your cookies here.</p>
<h2 id="privacy">Privacy policy</h2><p>Describe your data processing here.</p>
</body>
</html>
