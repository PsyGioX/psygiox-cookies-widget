name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Every file carries the PsyGioX copyright notice
        run: npm run headers
      - name: Build (minify, hashes, archive, English page, sitemap)
        run: npm run build
      - name: dist and generated pages must be committed (reproducible build)
        if: matrix.node == 22
        run: git diff --exit-code -- widget/dist en index.html sitemap.xml robots.txt sw.js
      - name: Verify hashes
        run: npm run verify
      - name: Tests
        run: npm test
